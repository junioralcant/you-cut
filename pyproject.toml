[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youcut"
version = "0.1.0"
description = "Gerador automático de clipes virais a partir de vídeos longos"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "anthropic>=0.40.0",
    "faster-whisper>=1.0.0",
    "yt-dlp>=2024.1.0",
    "Pillow>=10.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "httpx>=0.25.0",
    "questionary>=2.0.0",
]

[project.optional-dependencies]
whisper-openai = ["openai-whisper"]
dev = [
    "pytest>=8.0.0",
    "pytest-env>=1.1.0",
    "respx>=0.21.0",
]

[project.scripts]
youcut = "youcut.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
